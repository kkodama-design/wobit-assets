<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Worbit</title>

  <link rel="apple-touch-icon" href="./worbit-icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Worbit">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta name="theme-color" content="#0f1827">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #0f1827;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .launcher {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      border-radius: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #9aa7b5;
      font-size: 14px;
      line-height: 1.7;
    }

    .open {
      display: block;
      margin-top: 28px;
      padding: 15px 20px;
      border-radius: 14px;
      background: #5da2f8;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>

  <script>
    const WORBIT_URL =
      "https://script.google.com/a/macros/kd-lab.co.jp/s/AKfycbzy9kUb25awwiBywkff7ExurO_1byEoxETdDaeughNi1nMd-Ioi_3escNA0yFXHyDbM/exec";

    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (standalone) {
      window.location.replace(WORBIT_URL);
    }
  </script>
</head>

<body>

  <main class="launcher">
    <img
      class="icon"
      src="./worbit-icon-192.png"
      alt="Worbit"
    >

    <h1>Worbit</h1>

    <p>
      このページをSafariの共有メニューから<br>
      「ホーム画面に追加」してください。
    </p>

    <a
      class="open"
      href="https://script.google.com/a/macros/kd-lab.co.jp/s/AKfycbzy9kUb25awwiBywkff7ExurO_1byEoxETdDaeughNi1nMd-Ioi_3escNA0yFXHyDbM/exec"
    >
      Worbitを開く
    </a>
  </main>

</body>
</html>
