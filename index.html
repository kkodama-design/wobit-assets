<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Worbit</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png?v=3"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./favicon-32.png?v=3"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Worbit">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1827">

  <style>
    :root {
      --bg: #f4f5f7;
      --text: #111111;
      --muted: #667085;
      --button: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1827;
        --text: #ffffff;
        --muted: #9aa7b5;
        --button: #5f9ff5;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(32px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(32px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
    }

    .launcher {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .worbit-logo {
      width: min(290px, 78vw);
      margin: 0 auto 28px;
    }

    .worbit-logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .logo-white {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .logo-black {
        display: none;
      }

      .logo-white {
        display: block;
      }
    }

    .description {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    .open-button {
      display: block;
      margin-top: 28px;
      padding: 15px 20px;
      border-radius: 14px;
      background: var(--button);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>

  <script>
    const WORBIT_URL =
      "https://script.google.com/a/macros/kd-lab.co.jp/s/AKfycbzy9kUb25awwiBywkff7ExurO_1byEoxETdDaeughNi1nMd-Ioi_3escNA0yFXHyDbM/exec";

    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (standalone) {
      window.location.replace(WORBIT_URL);
    }
  </script>
</head>

<body>

  <main class="launcher">

    <div class="worbit-logo">
      <img
        class="logo-black"
        src="./worbit-logo-black.png?v=3"
        alt="Worbit"
      >

      <img
        class="logo-white"
        src="./worbit-logo-white.png?v=3"
        alt="Worbit"
      >
    </div>

    <p class="description">
      Safariの共有メニューから<br>
      「ホーム画面に追加」してください。
    </p>

    <a
      class="open-button"
      href="https://script.google.com/a/macros/kd-lab.co.jp/s/AKfycbzy9kUb25awwiBywkff7ExurO_1byEoxETdDaeughNi1nMd-Ioi_3escNA0yFXHyDbM/exec"
    >
      Worbitを開く
    </a>

  </main>

</body>
</html>
